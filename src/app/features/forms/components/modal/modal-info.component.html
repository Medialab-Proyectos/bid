<div class="pb-md-3 mt-3">
  <div class="col-md-12">
    <div class="row">
      <legend
        class="o-fieldset__legend"
        style="display: flex; justify-content: space-evenly"
      >
        <kendo-label
          style="font-size: 14px"
          text="{{ 'BIDDINDG.PENDINGPUBLICATION.MODAL.LABEL' | translate }}"
        >
        </kendo-label>
        <div
          kendoTooltip
          [title]="'BIDDINDG.PENDINGPUBLICATION.MODAL.TOOLTIP' | translate"
          class="o-fieldset__legend-icon"
        >
          <em class="fas fa-info-circle"></em>
        </div>
      </legend>
    </div>
  </div>
  <div class="col-md-12 pb-md-3">
    <kendo-datetimepicker
      [min]="min"
      [(ngModel)]="defaultDate"
      [(value)]="defaultDate"
      (valueChange)="onValueChange($event)"
      class="c-datepicker w-100"
      format="dd MMM yyyy HH:mm"
      required
      id="data-picker-gpn"
    ></kendo-datetimepicker>
  </div>
  <div class="col-md-12 pb-md-3">
    <fi-alert
      [type]="'info'"
      title="{{ 'BIDDINDG.PENDINGPUBLICATION.MODAL.INFO' | translate }} {{
        numberDay + newNumberDay
      }} {{ 'BIDDINDG.PENDINGPUBLICATION.MODAL.INFO2' | translate }}"
    >
    </fi-alert>
  </div>
  <div class="col-md-12">
    <kendo-label
      style="font-size: 14px"
      text="{{
        'BIDDINDG.PENDINGPUBLICATION.MODAL.PUBLICATION_LABEL1' | translate
      }}{{ groupText }}{{
        'BIDDINDG.PENDINGPUBLICATION.MODAL.PUBLICATION_LABEL2' | translate
      }}"
    >
    </kendo-label>
  </div>
</div>
<div class="pb-md-3 actions">
  <div class="col-12" style="display: flex; justify-content: flex-end">
    <button kendoButton (click)="close()">
      {{ "BIDDINDG.PENDINGPUBLICATION.MODAL.BUTTON.NO" | translate }}
    </button>
    <button
      kendobutton
      class="btn btn-brand qa-btn-publication"
      (click)="saveDate()"
      id="btn-save"
      style="margin-left: 2%"
    >
      {{ "BIDDINDG.PENDINGPUBLICATION.MODAL.BUTTON.OK" | translate }}
    </button>
  </div>
</div>
