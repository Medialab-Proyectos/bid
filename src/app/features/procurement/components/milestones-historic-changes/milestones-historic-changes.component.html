<ng-template #template let-anchor>
  <span
    [innerHTML]="
      anchor.nativeElement.innerText | highlightSearch : highlightValue
    "
  ></span>
</ng-template>

<div kendoTooltip showOn="none" [tooltipTemplate]="template">
  <div class="transactions-list">
    <div class="transactions-list__table">
      <div class="table-transactions">
        <kendo-grid
          [kendoGridBinding]="data"
          [groupable]="false"
          scrollable="none"
        >
          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.MILESTONES.MILESTONE_NAME_HEADER'
                | translate
            }}"
            field="nameMilestone"
          >
          </kendo-grid-column>
          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.MILESTONES.ESTIMATED_DATE'
                | translate
            }}"
            field="estimatedDate"
          ></kendo-grid-column>
          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.MILESTONES.REESTIMATED_DATE'
                | translate
            }}"
            field="reestimatedDate"
          ></kendo-grid-column>
          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.MILESTONES.UPDATED_DATE' | translate
            }}"
            field="modificationDate"
          ></kendo-grid-column>
          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.MILESTONES.UPDATED_BY' | translate
            }}"
            field="modifiedBy"
          >
          </kendo-grid-column>
        </kendo-grid>
      </div>
    </div>
  </div>
</div>
