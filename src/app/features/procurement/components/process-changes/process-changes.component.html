<ng-template #template let-anchor>
  <span
    [innerHTML]="
      anchor.nativeElement.innerText | highlightSearch : highlightValue
    "
  ></span>
</ng-template>

<div class="k-label">
  <kendo-label>{{
    "PROCUREMENT.HISTORIC_CHANGES.PROCESS.TAB_HEADER" | translate
  }}</kendo-label>
</div>
<div kendoTooltip showOn="none" [tooltipTemplate]="template">
  <div class="transactions-list k-dragable-columns">
    <div class="transactions-list__table">
      <div class="table-transactions">
        <kendo-grid
          class="k-grid-process-changes"
          [kendoGridBinding]="gridView"
          [groupable]="true"
          [resizable]="true"
          scrollable="none"
        >
          <kendo-grid-messages
            [groupPanelEmpty]="'PROCUREMENT.TABLE.DRAG_COLUMN_MSG' | translate"
            [noRecords]="'PROCUREMENT.HISTORIC_CHANGES.NO_UPDATES' | translate"
          >
          </kendo-grid-messages>
          <ng-template
            kendoGridToolbarTemplate
            position="top"
            class="k-grid-toolbar"
          >
            <fi-filter
              class="d-block c-filter"
              [minLength]="3"
              [placeholder]="'DASHBOARD.ADVANCED_SEARCH' | translate"
              (filterValue)="onFilter($event)"
            ></fi-filter>
          </ng-template>

          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.PROCESS.UPDATED_BY' | translate
            }}"
            field="modifiedBy"
          >
            <ng-template kendoGridCellTemplate let-dataItem>
              <span
                [innerHTML]="
                  dataItem.modifiedBy | highlightSearch : highlightValue
                "
              ></span>
            </ng-template>
          </kendo-grid-column>
          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.PROCESS.UPDATED_VALUE' | translate
            }}"
            field="updatedValue"
          >
            <ng-template kendoGridCellTemplate let-dataItem>
              <span
                [innerHTML]="
                  dataItem.updatedValue | highlightSearch : highlightValue
                "
              ></span>
            </ng-template>
          </kendo-grid-column>
          <kendo-grid-column
            [width]="300"
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.PROCESS.PREVIOUS_VALUE' | translate
            }}"
            field="previousValue"
          >
            <ng-template kendoGridCellTemplate let-dataItem>
              <span
                [innerHTML]="
                  dataItem.previousValue | highlightSearch : highlightValue
                "
              ></span>
            </ng-template>
          </kendo-grid-column>
          <kendo-grid-column
            [width]="300"
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.PROCESS.NEW_VALUE' | translate
            }}"
            field="newValue"
          >
            <ng-template kendoGridCellTemplate let-dataItem>
              <span
                [innerHTML]="
                  dataItem.newValue | highlightSearch : highlightValue
                "
                class="k-grid-column-text"
              >
              </span>
            </ng-template>
          </kendo-grid-column>
          <kendo-grid-column
            title="{{
              'PROCUREMENT.HISTORIC_CHANGES.PROCESS.UPDATED_DATE' | translate
            }}"
            field="modified"
          >
            <ng-template kendoGridCellTemplate let-dataItem>
              <span
                [innerHTML]="
                  dataItem.modified | highlightSearch : highlightValue
                "
              ></span>
            </ng-template>
          </kendo-grid-column>
        </kendo-grid>
      </div>
    </div>
  </div>
</div>
