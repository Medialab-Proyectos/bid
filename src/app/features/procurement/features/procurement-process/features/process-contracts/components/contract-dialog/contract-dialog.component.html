<div class="confirm-dialog">
  <!-- Header -->
  <div class="confirm-dialog__header" mat-dialog-title>
    <h2 class="confirm-dialog__title">{{ data.title }}</h2>
  </div>

  <!-- Content -->
  <div class="confirm-dialog__content" mat-dialog-content>
    <p class="confirm-dialog__message">{{ data.message }}</p>
  </div>

  <!-- Actions -->
  <div class="confirm-dialog__actions" mat-dialog-actions>
    <button
      mat-button
      class="confirm-dialog__button confirm-dialog__button--cancel"
      (click)="onCancel()"
      type="button"
    >
      {{ data.cancelText }}
    </button>
    <button
      mat-raised-button
      [color]="data.confirmButtonColor"
      class="confirm-dialog__button confirm-dialog__button--confirm"
      (click)="onConfirm()"
      type="button"
    >
      {{ data.confirmText }}
    </button>
  </div>
</div>
