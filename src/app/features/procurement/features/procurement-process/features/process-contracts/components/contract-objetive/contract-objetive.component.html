<div class="c-objetive">
  <fi-accordion-panel>
    <ng-container number *ngIf="number">{{ number }}</ng-container>
    <ng-container title>{{
      "CONTRACT.GENERAL_INFO.CONTRACT_OBJECTIVE" | translate
    }}</ng-container>
    <ng-container body>
      <div class="objetive">
        <div class="row">
          <div class="col-12 col-md-12">
            <mat-form-field class="w-100">
              <textarea
                matInput
                #objective
                data-testid="objective"
                id="Txa_objetive"
                [formControl]="form"
                [placeholder]="''"
              ></textarea>
            </mat-form-field>
          </div>
        </div>
      </div>
    </ng-container>
  </fi-accordion-panel>
</div>
