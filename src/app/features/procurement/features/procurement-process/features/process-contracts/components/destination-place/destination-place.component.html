<div class="c-destination-place">
  <fi-accordion-panel>
    <ng-container number *ngIf="number">{{ number }}</ng-container>
    <ng-container title>{{
      "CONTRACT.DESTINATION_PLACE.TITLE" | translate
    }}</ng-container>
    <ng-container body>
      <div class="destination-place" [formGroup]="form">
        <div class="row">
          <div class="col-12 col-md-12">
            <mat-form-field class="w-100">
              <mat-label>{{
                "CONTRACT.DESTINATION_PLACE.ADDRESS" | translate
              }}</mat-label>
              <input
                matInput
                #address
                formControlName="address"
                data-testid="address"
                [fiDisableControl]="baseConfig.settings.disabled"
                id="Txb_Address"
              />
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-12 col-md-4">
            <mat-form-field class="w-100">
              <mat-label>{{
                "CONTRACT.DESTINATION_PLACE.ZIP_CODE" | translate
              }}</mat-label>
              <input
                matInput
                #zipCode
                formControlName="zipCode"
                data-testid="zipCode"
                [fiDisableControl]="baseConfig.settings.disabled"
                id="Txb_Zip_code"
              />
            </mat-form-field>
          </div>

          <div class="col-12 col-md-4">
            <mat-form-field class="w-100">
              <mat-label>{{
                "CONTRACT.DESTINATION_PLACE.COUNTRY" | translate
              }}</mat-label>
              <mat-select
                #country
                formControlName="country"
                data-testid="country"
                [fiDisableControl]="baseConfig.settings.disabled"
                id="Down_Country"
              >
                <mat-option
                  *ngFor="let country of baseConfig.data.beneficiaryCountries"
                  [value]="country.code"
                  >{{ country.name | translate }}</mat-option
                >
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
    </ng-container>
  </fi-accordion-panel>
</div>
