<ng-container *ngIf="hasPermissionSeeContract">
  <ng-template #template let-anchor>
    <span [innerHTML]="anchor.nativeElement.innerText"></span>
  </ng-template>

  <div
    kendoTooltip
    showOn="none"
    [tooltipTemplate]="template"
    (mouseover)="showTooltip($event)"
  >
    <div
      class="c-contracts o-card row process-tab-card"
      *ngIf="!selectedContract; else contractDetails"
    >
      <div class="col-12 pt-3" *ngIf="!isLoading; else loader">
        <fi-alert
          *ngIf="!userInternal && informationalMessage !== ''"
          data-testid="c-contracts-close-instructions"
          type="info"
          [title]="informationalMessage | translate"
          [closable]="true"
        ></fi-alert>

        <div class="c-contracts__add-contract">
          <ng-container *ngIf="displayCompleteContracts">
            <button
              kendoButton
              class="btn btn-brand mr-3"
              id="Btn_CompleteContract"
              *fiDisplayByPermissions="completeContractsPermission"
              data-testid="Btn_CompleteContract"
              (click)="openModalCompleteContracts()"
            >
              {{ 'CONTRACT.COMPLETE_CONTRACT' | translate }}
            </button>
          </ng-container>
          <ng-container *ngIf="showAddContract && displayAddContractBtn">
            <button
              kendoButton
              class="btn btn-brand"
              id="Btn_AddContract"
              *fiDisplayByPermissions="newContractButtonPermission"
              data-testid="Btn_AddContract"
              (click)="createContract()"
            >
              {{ 'CONTRACT.ADD_CONTRACT' | translate }}
            </button>
          </ng-container>
        </div>

        <fi-contracts-tables
          [contracts]="contractsPendingSignature"
          [accordionSettings]="accordionSettingsPendingSignature"
          [procurementProcessId]="procurementProcessId"
          [selectedLanguage]="selectedLanguage"
          [isPlanNotInSync]="isPlanNotInSync"
          [title]="'CONTRACT.PENDING_SIGNATURE_TABLE_TITTLE' | translate"
        ></fi-contracts-tables>
        <fi-contracts-tables
          [contracts]="contractsNotPendingSignature"
          [accordionSettings]="accordionSettingsNotPendingSignature"
          [procurementProcessId]="procurementProcessId"
          [selectedLanguage]="selectedLanguage"
          [isPlanNotInSync]="isPlanNotInSync"
          [title]="'CONTRACT.CONFIRMED_CONTRACT_TABLE_TITTLE' | translate"
        ></fi-contracts-tables>
      </div>
    </div>
  </div>

  <ng-template #contractDetails>
    <fi-contract-details
      [contract]="selectedContract"
      (goBack)="hideDetails()"
    ></fi-contract-details>
  </ng-template>

  <ng-template #loader>
    <div class="text-center py-5">
      <fi-loader></fi-loader>
    </div>
  </ng-template>
</ng-container>
