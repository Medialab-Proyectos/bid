<div class="process-header-card procurement-tab-menu" id="kendoTabstrip">
  <div class="col-12 mb-0">
    <div class="c-procurement-process-tab not-mobile">
      <ul class="sf400">
        <li class="desktop-item" *ngFor="let link of navLinks; let i = index">
          <a
            class="tab-item"
            [routerLink]="link.link"
            [routerLinkActive]="['tab-active']"
            [id]="'Lnk_Procurement_tab_' + (i + 1)"
            [routerLinkActiveOptions]="link.matchFullpath"
            >{{ link.label | translate }}</a
          >
        </li>
      </ul>
    </div>
  </div>
  <router-outlet></router-outlet>
  <div
    *fiDisplayByPermissions="goToTopButtonPermission"
    class="d-flex justify-content-end"
  >
    <fi-scroll-button
      *ngIf="!isProcessLoading"
      [id]="'kendoTabstrip'"
    ></fi-scroll-button>
  </div>
</div>
