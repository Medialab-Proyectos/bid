<div
  id="draftCommentsSection"
  [formGroup]="_commentsForm"
  style="
    max-height: 28rem;
    overflow: auto;
    overflow-x: hidden;
    margin-top: 40px;
  "
>
  <div formArrayName="comments">
    <div
      *ngFor="let item of comments?.controls; let i = index"
      [formGroupName]="i"
    >
      <div class="row">
        <div class="col-12 col-md-1 c-process-comments__avatar">
          <fi-avatar
            [userNameInitials]="comments.controls[i].controls.createdBy.value"
          ></fi-avatar>
        </div>
        <input type="hidden" formControlName="id" />
        <div class="col-12 col-md-11">
          <kendo-editor
            class="c-process-coments__editor"
            formControlName="text"
            ngDefaultControl
            [placeholder]="'PROCUREMENT.ADD_COMMENT' | translate"
          >
            <kendo-toolbar>
              <kendo-toolbar-buttongroup>
                <kendo-toolbar-button
                  kendoEditorBoldButton
                ></kendo-toolbar-button>
                <kendo-toolbar-button
                  kendoEditorItalicButton
                ></kendo-toolbar-button>
                <kendo-toolbar-button
                  kendoEditorUnderlineButton
                ></kendo-toolbar-button>
                <kendo-toolbar-button
                  kendoEditorIndentButton
                ></kendo-toolbar-button>
                <kendo-toolbar-button
                  kendoEditorOutdentButton
                ></kendo-toolbar-button>
                <kendo-toolbar-button kendoEditorInsertUnorderedListButton>
                </kendo-toolbar-button>
                <kendo-toolbar-button
                  kendoEditorInsertOrderedListButton
                ></kendo-toolbar-button>
              </kendo-toolbar-buttongroup>
            </kendo-toolbar>

            <kendo-editor-messages
              [bold]="'COMMON.EDITOR_BOLD' | translate"
              [italic]="'COMMON.EDITOR_ITALIC' | translate"
              [underline]="'COMMON.EDITOR_UNDERLINE' | translate"
              [indent]="'COMMON.EDITOR_INDENT' | translate"
              [outdent]="'COMMON.EDITOR_OUTDENT' | translate"
              [insertUnorderedList]="'COMMON.EDITOR_INSERT_UL' | translate"
              [insertOrderedList]="'COMMON.EDITOR_INSERT_OL' | translate"
            >
            </kendo-editor-messages>
          </kendo-editor>

          <div
            class="d-flex"
            *ngIf="
              comments.controls[i].invalid &&
              (comments.controls[i].dirty || comments.controls[i].touched)
            "
          >
            <div class="o-input-error">
              {{ "PROCUREMENT_COMMENT.REQUIRED" | translate }}
            </div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-1"></div>
        <div class="col-11">
          <div class="pt-3 pb-2" style="text-align: left">
            {{ "PROCUREMENT.PROCESS.COMMENT_FOR_EXECUTING_AGENCY" | translate }}
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-1"></div>
        <div class="col-11 d-flex justify-content-between">
          <div>
            <ul class="k-radio-list">
              <li
                class="k-radio-item"
                *ngFor="let item of visibility; let j = index"
              >
                <label class="k-radio-label">
                  <input
                    type="radio"
                    value="{{ item.id }}"
                    formControlName="visibility"
                    kendoRadioButton
                    [id]="'Rbn_Visibility_' + (j + 1)"
                    #visibility
                    [disabled]="disableVisibility(i)"
                  />
                  <span>
                    {{ item.name | translate }}
                  </span>
                </label>
              </li>
            </ul>
          </div>
          <ng-container>
            <button
              kendoButton
              iconClass="far fa-trash-alt"
              type="button"
              look="clear"
              id="Btn_Delete_comment"
              (click)="deleteComment(i)"
              [disabled]="disabledByProperty[i]"
            ></button>
          </ng-container>
        </div>
      </div>
      <div class="separator1em fi-procurement--border"></div>
    </div>
  </div>
</div>
<div class="row c-process-comments__button">
  <button
    kendoButton
    #commentInput
    class="btn btn-online-brand mb-3 mx-md-2"
    icon="plus"
    id="Btn_Add_comment"
    (click)="addNewCommentFormGroup()"
  >
    {{ "PROCUREMENT.ENTER_A_NEW_COMMENT" | translate }}
  </button>
</div>
