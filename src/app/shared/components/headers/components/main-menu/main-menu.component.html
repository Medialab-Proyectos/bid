<div class="container-fluid h-full">
  <div class="row align-items-end h-full">
    <div class="col-12 grid">
      <div class="main-menu__options">
        <div [ngClass]="!mobileView ? 'logo' : null">
          <div
            class="iconButton"
            [ngClass]="mobileView ? 'iconButton-mobile' : null"
          >
            <em class="fas fa-ellipsis-v"></em>
            <em class="fas fa-ellipsis-v"></em>
            <em class="fas fa-ellipsis-v"></em>
          </div>
          <div class="main-menu__title-container--name">
            <span>
              {{ "SHARED.HEADERS.MAIN_MENU.FIDUCIARY_INTERFACE" | translate }}
            </span>
          </div>
        </div>
        <div class="d-flex" *ngIf="!mobileView">
          <a
            *ngFor="let option of options"
            [routerLink]="[option.routeTo]"
            [routerLinkActive]="['active']"
            [id]="'Lnk_Main_menu_' + option.name"
          >
            <span>{{ option.name | translate }}</span>
            <em *ngIf="option.dropdown" class="fas fa-chevron-down"></em
          ></a>
        </div>
      </div>
    </div>
  </div>
</div>
