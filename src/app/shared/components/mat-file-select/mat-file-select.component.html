<div class="file-upload-container" *fiDisplayByPermissionsSa="permission">
  <div
    class="drop-zone"
    [class.drag-over]="isDragOver"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="openFileDialog()"
  >
    <button
      mat-raised-button
      color="primary"
      class="upload-button"
      (click)="$event.stopPropagation(); openFileDialog()"
    >
      <mat-icon>cloud_upload</mat-icon>
      {{ 'SHARED.DOCUMENT.UPLOAD_FILES' | translate }}
    </button>
  </div>

  <input
    #fileInput
    type="file"
    class="file-input"
    [accept]="acceptString"
    [multiple]="multiple"
    (change)="onFileSelected($event)"
  />

  <!-- Lista de archivos seleccionados -->
  <div
    class="selected-files"
    *ngIf="fileListVisible && selectedFiles.length > 0"
  >
    <h4>Archivos seleccionados:</h4>
    <div class="file-list">
      <div
        class="file-item"
        *ngFor="let rawFile of selectedFiles; let i = index"
      >
        <mat-icon class="file-icon">description</mat-icon>
        <div class="file-info">
          <span class="file-name">{{ rawFile.name }}</span>
          <span class="file-details">
            {{ rawFile.extension }} - {{ formatFileSize(rawFile.size) }} - UID:
            {{ rawFile.uid.substring(0, 8) }}...
          </span>
        </div>
        <button
          mat-icon-button
          color="warn"
          (click)="removeFile(i)"
          class="remove-button"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
